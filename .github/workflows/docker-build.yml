name: Docker Build & Push

# Builds the backend and frontend production images and publishes them to
# GitHub Container Registry (ghcr.io). Pull requests only build (no push) to
# validate the Dockerfiles; pushes to main and version tags publish images.
#
# When the ACR_USERNAME / ACR_PASSWORD secrets are present the same build is
# additionally pushed to Aliyun ACR (faster pulls from mainland China). One
# build, two registries -- buildx pushes every tag metadata-action emits.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ACR_IMAGE_PREFIX: crpi-60iblxi36hykzkgd.cn-hangzhou.personal.cr.aliyuncs.com/question-bank

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stamp the git tag into app/_version.py so `/system/version` reports the
      # real release instead of the repo's dev-default "0.1.0" (mirrors desktop-build.yml).
      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: backend
        run: |
          v="${GITHUB_REF_NAME#v}"
          printf '__version__ = "%s"\n' "$v" > app/_version.py
          echo "Stamped version $v"
          cat app/_version.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Forks and PRs have no ACR credentials; skip that registry instead of failing.
      - name: Resolve ACR availability
        id: acr
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
        run: |
          if [ -n "$ACR_USERNAME" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Aliyun ACR
        if: steps.acr.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: crpi-60iblxi36hykzkgd.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}-backend
            name=${{ env.ACR_IMAGE_PREFIX }}/question-bank-backend,enable=${{ steps.acr.outputs.enabled }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: pro
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve ACR availability
        id: acr
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
        run: |
          if [ -n "$ACR_USERNAME" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Aliyun ACR
        if: steps.acr.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: crpi-60iblxi36hykzkgd.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend
            name=${{ env.ACR_IMAGE_PREFIX }}/question-bank-frontend,enable=${{ steps.acr.outputs.enabled }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: pro
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
